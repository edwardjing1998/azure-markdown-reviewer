name: Build and deploy reviewer

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [development, qa, production]
        default: development
        required: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      APP_NAME: azure-markdown-reviewer
      IMAGE: ghcr.io/${{ github.repository_owner }}/azure-markdown-reviewer
      OPENSHIFT_SERVER: ${{ vars.OPENSHIFT_SERVER }}
      OPENSHIFT_NAMESPACE: ${{ vars.OPENSHIFT_NAMESPACE }}
      AZURE_STORAGE_ENDPOINT: ${{ vars.AZURE_STORAGE_ENDPOINT }}
      AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
      AZURE_STORAGE_OUTPUT_PREFIX: ${{ vars.AZURE_STORAGE_OUTPUT_PREFIX }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: latest
      - name: Log in to OpenShift
        run: oc login "$OPENSHIFT_SERVER" --token="${{ secrets.OPENSHIFT_TOKEN }}"
      - name: Configure and deploy
        shell: bash
        run: |
          set -euo pipefail
          oc project "$OPENSHIFT_NAMESPACE"
          oc create secret generic azure-markdown-reviewer-azure \
            --from-literal=AZURE_CLIENT_ID="${{ secrets.AZURE_CLIENT_ID }}" \
            --from-literal=AZURE_TENANT_ID="${{ secrets.AZURE_TENANT_ID }}" \
            --from-literal=AZURE_CLIENT_SECRET="${{ secrets.AZURE_CLIENT_SECRET }}" \
            --dry-run=client -o yaml | oc apply -f -
          oc apply -f openshift/configmap.yaml
          oc apply -f openshift/service-route.yaml
          oc apply -f openshift/deployment.yaml
          oc set env configmap/azure-markdown-reviewer-config \
            PORT=8080 \
            AZURE_STORAGE_ENDPOINT="$AZURE_STORAGE_ENDPOINT" \
            AZURE_STORAGE_CONTAINER="$AZURE_STORAGE_CONTAINER" \
            AZURE_STORAGE_OUTPUT_PREFIX="${AZURE_STORAGE_OUTPUT_PREFIX:-generated/}"
          oc set image deployment/$APP_NAME app="$IMAGE:${{ github.sha }}"
          oc rollout status deployment/$APP_NAME --timeout=180s
          oc get route $APP_NAME -o jsonpath='https://{.spec.host}{"\n"}'
