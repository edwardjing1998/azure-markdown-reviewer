name: Build and deploy reviewer

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment and OpenShift target
        required: true
        type: choice
        options:
          - development
          - qa
          - production
        default: development

permissions:
  contents: read
  packages: write

concurrency:
  group: azure-markdown-reviewer-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}

    env:
      APP_NAME: azure-markdown-reviewer
      IMAGE: ghcr.io/${{ github.repository_owner }}/azure-markdown-reviewer
      OPENSHIFT_SERVER: ${{ vars.OPENSHIFT_SERVER }}
      OPENSHIFT_NAMESPACE: ${{ vars.OPENSHIFT_NAMESPACE }}
      AZURE_STORAGE_ENDPOINT: ${{ vars.AZURE_STORAGE_ENDPOINT }}
      AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
      AZURE_STORAGE_OUTPUT_PREFIX: ${{ vars.AZURE_STORAGE_OUTPUT_PREFIX }}
      SECURITY_AUTH_URL: ${{ vars.SECURITY_AUTH_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate required configuration
        shell: bash
        env:
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          required_values=(
            OPENSHIFT_SERVER
            OPENSHIFT_NAMESPACE
            OPENSHIFT_TOKEN
            AZURE_STORAGE_ENDPOINT
            AZURE_STORAGE_CONTAINER
            AZURE_CLIENT_ID
            AZURE_TENANT_ID
            AZURE_CLIENT_SECRET
            SECURITY_AUTH_URL
          )

          for name in "${required_values[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Environment variable or secret: $name"
              exit 1
            fi
          done

          if [[ ! "$AZURE_STORAGE_ENDPOINT" =~ ^https:// ]]; then
            echo "::error::AZURE_STORAGE_ENDPOINT must begin with HTTPS."
            exit 1
          fi

          test -f Dockerfile
          test -f package.json
          test -f package-lock.json
          test -f server/index.mjs
          test -f server/storage.mjs
          test -f openshift/deployment.yaml
          test -f openshift/service-route.yaml

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ inputs.environment }}-latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: latest

      - name: Log in to OpenShift
        env:
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
        run: |
          set -euo pipefail
          oc login "$OPENSHIFT_SERVER" --token="$OPENSHIFT_TOKEN"
          oc project "$OPENSHIFT_NAMESPACE"

      - name: Create Azure runtime secret
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          oc create secret generic azure-markdown-reviewer-azure \
            --from-literal=AZURE_CLIENT_ID="$AZURE_CLIENT_ID" \
            --from-literal=AZURE_TENANT_ID="$AZURE_TENANT_ID" \
            --from-literal=AZURE_CLIENT_SECRET="$AZURE_CLIENT_SECRET" \
            --dry-run=client \
            -o yaml | oc apply -f -

      - name: Create application ConfigMap
        run: |
          set -euo pipefail

          oc create configmap azure-markdown-reviewer-config \
            --from-literal=PORT="8080" \
            --from-literal=AZURE_STORAGE_ENDPOINT="$AZURE_STORAGE_ENDPOINT" \
            --from-literal=AZURE_STORAGE_CONTAINER="$AZURE_STORAGE_CONTAINER" \
            --from-literal=AZURE_STORAGE_OUTPUT_PREFIX="${AZURE_STORAGE_OUTPUT_PREFIX:-generated/}" \
            --from-literal=SECURITY_AUTH_URL="$SECURITY_AUTH_URL" \
            --dry-run=client \
            -o yaml | oc apply -f -

      - name: Deploy OpenShift resources
        run: |
          set -euo pipefail
          oc apply -f openshift/service-route.yaml
          oc apply -f openshift/deployment.yaml

      - name: Set deployment image
        run: |
          set -euo pipefail

          oc set image deployment/"$APP_NAME" \
            app="$IMAGE:${{ github.sha }}"

      - name: Wait for deployment rollout
        run: |
          set -euo pipefail

          oc rollout status deployment/"$APP_NAME" \
            --timeout=180s

      - name: Display deployment status
        run: |
          set -euo pipefail

          oc get deployment "$APP_NAME"
          oc get pods --selector="app=$APP_NAME"
          oc get service "$APP_NAME"
          oc get route "$APP_NAME"

          APP_URL="$(
            oc get route "$APP_NAME" \
              --output jsonpath='https://{.spec.host}'
          )"

          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"
          echo "Application URL: $APP_URL"

      - name: Verify application health
        run: |
          set -euo pipefail

          for attempt in {1..20}; do
            HTTP_STATUS="$(
              curl --silent --show-error \
                --output health-response.json \
                --write-out '%{http_code}' \
                "$APP_URL/api/health" || true
            )"

            if [[ "$HTTP_STATUS" == "200" ]]; then
              cat health-response.json
              exit 0
            fi

            echo "Health check attempt $attempt/20 returned HTTP $HTTP_STATUS."
            sleep 5
          done

          echo "::error::Application health check failed."
          cat health-response.json 2>/dev/null || true
          oc logs deployment/"$APP_NAME" --tail=200 || true
          exit 1

      - name: Verify Azure page discovery
        run: |
          set -euo pipefail

          HTTP_STATUS="$(
            curl --silent --show-error \
              --output pages-response.json \
              --write-out '%{http_code}' \
              "$APP_URL/api/pages" || true
          )"

          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "::error::Page discovery returned HTTP $HTTP_STATUS."
            cat pages-response.json 2>/dev/null || true
            oc logs deployment/"$APP_NAME" --tail=200 || true
            exit 1
          fi

          jq . pages-response.json

          PAGE_COUNT="$(jq -r '.pages | length' pages-response.json)"
          echo "Discovered page count: $PAGE_COUNT"

      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-markdown-reviewer-${{ inputs.environment }}-${{ github.run_number }}
          path: |
            health-response.json
            pages-response.json
          if-no-files-found: warn
          retention-days: 14

      - name: Log out from OpenShift
        if: always()
        run: oc logout || true